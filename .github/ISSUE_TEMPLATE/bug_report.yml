name: Bug report
description: Report something that isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description of the bug
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command used and terminal output
      render: console
  - type: input
    id: version
    attributes:
      label: Pipeline version
  - type: input
    id: executor
    attributes:
      label: Executor / profile used (e.g. slurm, docker, singularity)
  - type: textarea
    id: construct
    attributes:
      label: Barcode/UMI construct params used (solo_cb_start/len, solo_umi_start/len)
